# H_timetable_v5_stable: conservative rolling timetable optimization.
#
# This pilot is designed to attack the remaining v4 weakness: large holding and
# accumulated timetable drift. It keeps the fixed-300s reference, narrows the
# feasible planned headway, lowers the holding action ceiling, and strengthens
# direct timetable/holding penalties in the upper reward.
_extends: H_timetable_v4.yaml
_name: H_timetable_v5_stable

upper:
  action_bins: [-60.0, -30.0, 0.0, 30.0, 60.0]
  maximum_alpha: 0.06

lower:
  action_bins: [0.0, 3.0, 6.0, 9.0, 12.0, 15.0, 20.0, 30.0]
  maximum_alpha: 0.08

coupling:
  upper_warmup_eps: 15
  timetable:
    base_headway: 300.0
    min_headway: 240.0
    max_headway: 360.0
    min_notice: 60.0
    max_shift_abs: 900.0
    reward:
      holding_weight: 0.40
      total_time_weight: 0.20
      onboard_weight: 0.08
      lateness_weight: 0.30
      shift_weight: 0.18
      action_weight: 0.08
      holding_scale: 45.0
      total_time_scale: 25.0
      onboard_scale: 25.0
      lateness_scale: 180.0
      shift_scale: 900.0
      action_scale: 90.0
